name: Apply NABZ clean rebuild

on:
  push:
    branches:
      - main
    paths:
      - ".nabz-rebuild/READY"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact NABZ rebuild
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          source = ''.join(path.read_text() for path in sorted(Path('.nabz-rebuild').glob('part-*.b85')))
          Path('/tmp/nabz-clean-rebuild.tar.gz').write_bytes(base64.b85decode(source))
          PY
          echo "3aa2cdf1e63ede1ed3fc672d844102da  /tmp/nabz-clean-rebuild.tar.gz" | md5sum --check -
          tar -xzf /tmp/nabz-clean-rebuild.tar.gz -C .

          rm -f \
            sections/nabz-story.liquid \
            sections/nabz-surfaces.liquid \
            sections/nabz-closing.liquid \
            sections/nabz-catalog-gateway.liquid \
            sections/nabz-air-cable.liquid \
            sections/nabz-closing-drop.liquid \
            sections/nabz-construction-hero.liquid \
            sections/nabz-fit-system.liquid \
            sections/nabz-footer.liquid \
            sections/nabz-header.liquid \
            sections/nabz-product-assurances.liquid \
            sections/nabz-textile-distance.liquid \
            sections/nabz-textile-language.liquid \
            assets/nabz-scroll.css \
            assets/nabz-scroll.js \
            assets/nabz-scroll-safety.css \
            assets/nabz-hero-self-contour-hq.webp \
            assets/nabz-hero-self-contour-macro-hq.webp \
            assets/nabz-hero-air-cable-hq.webp \
            assets/nabz-product-1-hq.webp \
            assets/nabz-product-2-hq.webp \
            assets/nabz-product-3-hq.webp \
            assets/nabz-product-4-hq.webp \
            assets/nabz-product-5-hq.webp \
            assets/nabz-product-6-hq.webp \
            assets/nabz-product-7-hq.webp \
            assets/nabz-product-8-hq.webp \
            assets/nabz-fit-s-standard.webp \
            assets/nabz-fit-m-standard.webp \
            assets/nabz-fit-m-extended.webp \
            assets/nabz-fit-l-standard.webp \
            assets/nabz-fit-l-extended.webp \
            assets/nabz-fit-xl-standard.webp \
            assets/nabz-real-assets-v2-a.css \
            assets/nabz-real-assets-v2-a.css.liquid \
            assets/nabz-real-assets-v2-b.css \
            assets/nabz-real-assets-v2-b.css.liquid \
            assets/nabz-real-assets-v2-c.css \
            assets/nabz-real-assets-v2-c.css.liquid \
            assets/nabz-real-assets-v2-d.css \
            assets/nabz-real-assets-v2-d.css.liquid \
            assets/nabz-textile-distance.css \
            assets/nabz-textile-distance.js

          rm -rf .nabz-rebuild
          rm -f .github/workflows/apply-nabz-clean-rebuild.yml

      - name: Commit clean NABZ homepage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Rebuild NABZ homepage with exact assets"
          git push
