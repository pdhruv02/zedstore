name: Apply NABZ clean rebuild

on:
  push:
    branches:
      - main
    paths:
      - ".nabz-rebuild/READY"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify clean NABZ rebuild
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/nabz-clean-rebuild.tar.gz
          verify=/tmp/nabz-clean-verify

          cat .nabz-rebuild/part-*.b64 | base64 --decode > "$archive"
          echo "2345a36812a4ee7f0687c5e09a743434  $archive" | md5sum --check -

          rm -rf "$verify"
          mkdir -p "$verify"
          tar -xzf "$archive" -C "$verify"

          main="$verify/sections/nabz-clean-home.liquid"
          test -f "$main"
          test -f "$verify/sections/nabz-site-header.liquid"
          test -f "$verify/sections/nabz-site-footer.liquid"
          test -f "$verify/templates/index.json"
          test -f "$verify/assets/nabz-clean-home.css"
          test -f "$verify/assets/nabz-clean-home.js"

          grep -Fq "Not ethnic wear." "$main"
          grep -Fq "Not a plain shirt." "$main"
          grep -Fq "The space between." "$main"
          grep -Fq "India’s textile language, re-cut into everyday shirts. Clean from a distance. Unforgettable up close." "$main"
          grep -Fq "Unforgettable up close." "$main"
          grep -Fq "S or M size is too narrow and tight for you? and the next size is comfortably loose but becomes unnecessarily long?" "$main"
          grep -Fq "NABZ separates size and length" "$main"
          grep -Fq "shirts that feel like suit" "$main"
          grep -Fq "wanna promote our product? wanna provide feedback? wanna talk?" "$main"

          chapter_count=$(grep -o 'class="nabz-chapter' "$main" | wc -l | tr -d ' ')
          test "$chapter_count" = "5"

          product_count=$(find "$verify/assets" -maxdepth 1 -type f -name 'nabz-product-*.webp' | wc -l | tr -d ' ')
          test "$product_count" = "8"

          if grep -Eqi '<svg|<canvas|gsap|three\.js|scroll-lock' "$main"; then
            echo "Disallowed homepage implementation found."
            exit 1
          fi

          python - "$verify" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          missing = []
          for file in list((root / "sections").glob("*.liquid")) + list((root / "assets").glob("*.css")):
              text = file.read_text(encoding="utf-8")
              for name in re.findall(r"['\"]([^'\"]+)['\"]\s*\|\s*asset_url", text):
                  if not (root / "assets" / name).exists():
                      missing.append(f"{file.name}: {name}")
          if missing:
              raise SystemExit("Missing referenced assets:\n" + "\n".join(missing))
          PY

      - name: Replace old NABZ files
        shell: bash
        run: |
          set -euo pipefail
          verify=/tmp/nabz-clean-verify

          mkdir -p assets sections templates
          find assets -maxdepth 1 -type f -name 'nabz-*' -delete
          find sections -maxdepth 1 -type f -name 'nabz-*' -delete

          cp -a "$verify/assets/." assets/
          cp -a "$verify/sections/." sections/
          cp "$verify/templates/index.json" templates/index.json

          rm -rf .nabz-rebuild
          rm -f .github/workflows/apply-nabz-clean-rebuild.yml

      - name: Commit clean NABZ homepage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Rebuild NABZ homepage with exact assets"
          git push
