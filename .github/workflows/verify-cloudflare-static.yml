name: Verify NABZ Cloudflare build
on:
  push:
    branches: [cloudflare-static, fix/nabz-cloudflare-restore]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build standalone NABZ site
        run: node cloudflare/build.mjs
      - name: Verify output
        run: |
          test -f dist/index.html
          test -f dist/assets/nabz-clean-home.css
          test -f dist/assets/nabz-clean-home.js
          test -f dist/assets/nabz-mobile-native.css
          test -f dist/assets/nabz-mobile-native.js
          test -f dist/assets/nabz-standalone-fix.css
          test -f dist/assets/nabz-hero-air-cable.webp
          test -f dist/assets/nabz-product-phulkari-pixels.webp
          test -f dist/assets/nabz-story.mp4
          test -f dist/assets/nabz-story-poster.webp
          ! grep -q "{%" dist/index.html
          ! grep -q "{{" dist/index.html
          grep -q 'id="story"' dist/index.html
          grep -q 'data-mobile-chapter' dist/assets/nabz-mobile-native.js
          grep -q 'nabz-standalone-fix.css' dist/index.html
      - name: Install Playwright browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/nabz-http.log 2>&1 &
          echo $! > /tmp/nabz-http.pid
          sleep 1
      - name: Browser smoke test
        run: node cloudflare/smoke.mjs
      - name: Upload rendered screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nabz-render-smoke
          path: |
            nabz-*.png
          if-no-files-found: ignore
